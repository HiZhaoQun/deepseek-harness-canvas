<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Canvas capture harness</title>
<style>
  /* The canvas inherits the host's dark theme tokens; the real app provides
     these, so the capture harness declares the same dark palette. */
  :root {
    --dsw-alias-label-primary: #e9ebee;
    --dsw-alias-label-secondary: #9aa0a6;
    --dsw-alias-bg-base: #17181b;
    --dsw-alias-bg-layer-1: #202126;
    --dsw-alias-bg-layer-2: #26272d;
    --dsw-alias-bg-overlay: #24252b;
    --dsw-alias-border-l1: rgba(255, 255, 255, 0.08);
    --dsw-alias-border-l2: rgba(255, 255, 255, 0.16);
    --dsw-alias-brand-primary: #4d6bfe;
    --dsw-alias-state-error-primary: #f0736a;
    --dsw-alias-state-success-primary: #4cba8b;
    --dsw-alias-state-warn-primary: #e0b23c;
  }
  html, body { margin: 0; height: 100%; background: var(--dsw-alias-bg-base); }
  #root { height: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script src="./react.js"></script>
<script src="./react-dom.js"></script>
<script type="module">
  // A tiny host stand-in: the canvas view only needs React, a locale registry,
  // and a session remote that never emits. Everything else (store, cards,
  // markdown, styles) is the real plugin code served from /assets/.
  globalThis.__DEEPSEEK_CANVAS_REACT__ = window.React

  const dicts = new Map()
  const locale = {
    register(namespace, table) { dicts.set(namespace, table) },
    subscribe() { return () => {} },
    getSnapshot() { return 'zh' },
    bind(namespace) {
      return (key) => dicts.get(namespace)?.zh?.[key] ?? key
    },
  }

  const idleRemote = {
    follow() {
      return {
        [Symbol.asyncIterator]() {
          return { next: () => new Promise(() => {}) }
        },
        dispose() {},
      }
    },
  }

  const ctx = {
    get(name) { return name === 'remote.session' ? idleRemote : undefined },
    locale,
    effect() { return () => {} },
  }

  const DEMO_SESSION = 'demo'
  const storageKey = `deepseek-canvas:v1:${DEMO_SESSION}`

  const cards = [
    {
      id: 'c1', type: 'answer', parentId: null, x: 72, y: 72, collapsed: true, status: 'done',
      question: '这个插件是怎么把对话变成卡片的？',
      reasoning: '先把会话事件翻译成卡片状态，再让视图订阅这份状态。',
      content: '发送消息时，画布先插入一张**等待卡片**，回答到达后写入同一张卡片。\n\n- 每轮对话一张卡，问题与回答不分家\n- 流式内容只更新卡片，不重排画布\n- 折叠后只渲染标题和纯文本预览',
    },
    {
      id: 'c2', type: 'answer', parentId: 'c1', x: 72, y: 490, collapsed: true, status: 'done',
      question: '父子卡片之间那条连线是什么意思？',
      content: '选中一张卡片再提问，新的回答会成为它的**子卡片**，两张卡片之间画出一条曲线。\n\n连线只表达结构关系，模型看到的仍然是完整的会话历史。',
    },
    {
      id: 'c3', type: 'answer', parentId: 'c1', x: 608, y: 490, collapsed: true, status: 'done',
      question: '为什么要默认折叠成 4:3 瓦片？',
      content: '# 折叠的意义\n\n长会话里同时展开十几张卡片，浏览器要同时排版十几份 Markdown。\n\n- 折叠卡固定 `472 × 354`，只渲染标题和纯文本预览\n- 流式回答在折叠状态下不重绘\n- 展开卡是 `1008 × 772`，正好占 2×2 个槽位\n\n展开一张卡时，画布会自动找最近的空 2×2 区域，不会压到邻居。',
    },
    {
      id: 'c4', type: 'note', parentId: 'c1', x: 1144, y: 490, collapsed: true, status: 'done',
      title: '发布清单',
      content: '- [x] Apache-2.0 许可证\n- [x] README 界面截图\n- [ ] 首发宣传片\n- [ ] 收集第一批反馈\n\n安装方式：插件管理 → 安装本地 Bundle。',
    },
    {
      id: 'c5', type: 'answer', parentId: 'c2', x: 72, y: 908, collapsed: true, status: 'done',
      question: '网格磁吸会不会限制自由摆放？',
      content: '默认开启，但随时可以关。拖动时显示预设槽位，并高亮最近的落点；关掉之后就是一张普通白板。',
    },
    {
      id: 'c6', type: 'answer', parentId: 'c3', x: 608, y: 908, collapsed: true, status: 'done',
      question: '画布数据存在哪里？',
      content: '按会话存在浏览器 `localStorage`：\n\n```text\ndeepseek-canvas:v1:<sessionId>\n```\n\n包含卡片、视口、每张卡片的阅读位置，以及折叠和磁吸两个开关。',
    },
  ]

  const now = Date.now()
  const board = {
    version: 2,
    viewport: { x: 0, y: 0, zoom: 1 },
    controlsOpen: true,
    collapseAll: true,
    snapToGrid: true,
    scrolls: {},
    cards: cards.map((card, index) => ({ ...card, createdAt: now - (cards.length - index) * 60_000 })),
  }
  localStorage.setItem(storageKey, JSON.stringify(board))

  const { CanvasView } = await import('/assets/app.js?v=6')

  const root = ReactDOM.createRoot(document.getElementById('root'))
  root.render(React.createElement(CanvasView, {
    pluginCtx: ctx,
    sessionId: DEMO_SESSION,
    useSessionStatus: () => undefined,
    inputActions: undefined,
    openView() {},
  }))

  const storeOf = () => {
    const stores = globalThis.__DEEPSEEK_CANVAS_STORES__
    return stores?.get(DEMO_SESSION)
  }

  function waitFrames(count = 3) {
    return new Promise((resolve) => {
      let left = count
      const tick = () => (left-- <= 0 ? resolve() : requestAnimationFrame(tick))
      requestAnimationFrame(tick)
    })
  }

  function focus(cardId, zoom = 1) {
    const store = storeOf()
    const card = store.cardById(cardId)
    if (card === undefined) return
    const width = card.collapsed === false ? 1008 : 472
    const height = card.collapsed === false ? 772 : 354
    const { width: canvasWidth, height: canvasHeight } = store.size
    const x = canvasWidth / 2 - (card.x + width / 2) * zoom
    const y = canvasHeight / 2 - (card.y + height / 2) * zoom
    store.setViewport({ x, y, zoom })
  }

  // Every state starts from the same board: nothing selected, no reader, no
  // drag, every card collapsed. Otherwise a leftover expanded card from the
  // previous capture leaks into the next one.
  function resetView(store) {
    store.closeReader()
    store.setDraggingCard(undefined)
    store.select(undefined)
    for (const card of store.cards) store.setCardCollapsed(card.id, true)
  }

  const states = {
    async tiles() {
      const store = storeOf()
      resetView(store)
      store.setControlsOpen(true)
      store.fit()
      await waitFrames()
    },
    async branch() {
      const store = storeOf()
      resetView(store)
      store.setControlsOpen(true)
      store.select('c1')
      focus('c1', 1)
      await waitFrames()
    },
    async expanded() {
      const store = storeOf()
      resetView(store)
      // The control bar is hidden for the close-ups: its master collapse switch
      // would contradict a single expanded card on screen.
      store.setControlsOpen(false)
      store.setCardCollapsed('c3', false)
      focus('c3', 0.8)
      await waitFrames()
    },
    async drag() {
      const store = storeOf()
      resetView(store)
      store.setControlsOpen(false)
      // Lift the tile away from its slot and park it over an empty area so the
      // preset slot outlines and the magnetic target are both visible.
      store.updateCard('c5', { x: 1092, y: 96 })
      store.setDraggingCard('c5')
      focus('c5', 1.2)
      await waitFrames()
    },
    async reader() {
      const store = storeOf()
      resetView(store)
      store.setControlsOpen(false)
      store.openReader('c3')
      await waitFrames()
    },
    async controls() {
      const store = storeOf()
      resetView(store)
      store.setControlsOpen(true)
      store.fit()
      await waitFrames()
    },
  }

  window.__demo = {
    store: storeOf,
    states,
    apply: (name) => states[name](),
  }
  window.__demoReady = true
</script>
</body>
</html>
